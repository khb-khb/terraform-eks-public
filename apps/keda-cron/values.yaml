replicaCount: 0

image:
  repository: 378225464216.dkr.ecr.us-west-2.amazonaws.com/keda
  tag: "0bb864b"
  pullPolicy: Always

serviceAccount:
  create: true
  automount: true
  name: keda-consumer
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::378225464216:role/keda-consumer-irsa-role
    eks.amazonaws.com/sts-regional-endpoints: "true"

containerPort: 8080

httpRoute:
  enabled: false

env:
  - name: AWS_REGION
    value: us-west-2
  - name: QUEUE_URL
    value: https://sqs.us-west-2.amazonaws.com/378225464216/keda-queue

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

service:
  enabled: false

ingress:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false


keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60

  prometheus:
    enabled: false

  sqs:
    enabled: false

  cron:
    enabled: true
    timezone: Asia/Seoul
    start: "1 0 * * *"
    end: "3 0 * * *"
    desiredReplicas: "3"