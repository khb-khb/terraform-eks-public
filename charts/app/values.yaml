replicaCount: 1 

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

containerPort: 80

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: false

hpa:
  enabled: false

env: []

livenessProbe: {}
readinessProbe: {}
strategy: {}


keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60
  queueURL: ""
  queueLength: "5"
  awsRegion: us-west-2
  identityOwner: operator