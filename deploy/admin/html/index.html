<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Admin</title>
</head>

<body>
  <h2>Admin DB 조회 테스트</h2>

  <button id="dbTestBtn">DB 조회 테스트 </button>

  <pre id="dbResult">아직 조회하지 않았습니다. </pre>


  <script>
    const dbTestBtn = document.getElementById("dbTestBtn");
    const dbResult = document.getElementById("dbResult");

    dbTestBtn.addEventListener("click", async () => {
      dbResult.textContent = "DB 조회 중...";

      try {
        const response = await fetch("https://api.kim-test.shop/db-test");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        dbResult.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        dbResult.textContent =
          "DB 조회 실패: admin-api에 연결할 수 없습니다.\n" + error.message;
      }
    });
  </script>
</body>

</html>
