name: Deploy web to EKS

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "deploy/web/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPO: web
  HELM_VALUES_PATH: apps/web/values.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        

      - name: Configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/web
          file: ./deploy/web/Dockerfile.web
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:latest
            ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}

      - name: Sync repository
        run: |
          git pull --rebase origin master            

      - name: Update Helm image tag
        run: |
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|" $HELM_VALUES_PATH

      - name: Commit and push Helm values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"


          git add $HELM_VALUES_PATH
          git commit -m "Update web image tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push